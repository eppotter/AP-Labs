# Brightside Home Cleaning: fictional multi-branch residential cleaner.
# Demo client and profile #1. Schema: profiles/_schema/profile.schema.json.
schema_version: 1

client:
  id: brightside
  name: Brightside Home Cleaning

# Blast radius. Highest match wins; unmatched code floors at T1.
tiers:
  T3:
    # Access decisions: who can use what (in a client fork this file is .aplabs/profile.yml, always T3).
    - "profiles/**"
    - "billing/**"
    - "customers/export/**"
    # Runtime: writes to client systems, connections and secrets.
    - "kit/runtime/archetypes/approval-write/**"
    - "kit/runtime/connectors/**"
    - "kit/lib/secrets/**"
  T2:
    - "scheduling/**"
    - "Dockerfile"
    - ".github/workflows/**"
    # Runtime: SQL guardrails, the query runner and the LLM service.
    - "kit/runtime/sql/**"
    - "kit/runtime/data/**"
    - "kit/runtime/llm/**"
    # Runtime: the routing engine (Epic 12). Pure, but its plans reach dispatchers.
    - "kit/runtime/routing/**"
    # Runtime: the routing map's renderer and archetype (Story 15.5). Its image shows
    # approximate locations; the access filter and the upload (audience.js, slack/image.js)
    # are T3 for every fork (ENGINE_T3 in kit/lib/tier).
    - "kit/runtime/routing-map/**"
    - "kit/runtime/archetypes/routing-map/**"
  T1: ["lib/**"]
inert: ["**/*.md", "docs/**"]

gate:
  exempt: ["sandbox/**"]
  engagement_ttl_minutes: 60

resources:
  - key: TIER3_APPROVE
    label: Approve T3 changes
    admin_grantable: false
  - key: VERIFY_SKIP
    label: Waive a skipped verify check
  # Runtime: the hello-world module on the /brightside hub (open to everyone).
  - key: HELLO_WORLD
    label: Say hello
    open_access: true
  # Runtime: the Dataset module (Story 7.5). Open to everyone for the demo only: row
  # counts are business data (customer count, job volume), so a real fork should gate it
  # (grant it to roles) instead of open_access.
  - key: DATASET
    label: Dataset
    open_access: true
  # Runtime: the Outbox module (Story 8.3): what the mock email tool received, with a
  # sample of contacts (client data). Gated, not open_access: the admin role confers it
  # (admin_grantable defaults to true); grant it to anyone else who needs it.
  - key: OUTBOX
    label: Email outbox
  # Runtime: the Win-back list (Story 9.3): client names and emails (client data). Since
  # Story 10.2 it pushes the list to the email tool (approval-write), so it is owner-only:
  # the admin role does not confer it (admin_grantable: false, AD-16), and it is granted by
  # name (Dana for the demo). A read-only pull for more people would be a separate module.
  - key: WIN_BACK
    label: Win-back list
    admin_grantable: false
  # Runtime: Unpaid invoices (Story 9.5): client names with what they owe (client data).
  # Gated, not open_access: the admin role confers it; grant it to anyone else who needs it.
  - key: UNPAID_INVOICES
    label: Unpaid invoices
  # Runtime: Labour cost (Story 9.7): a month's total pay for visit time. Totals only, but pay
  # rates are open for the demo (GRD-006), so it is never open_access: only the admin role
  # confers it (the schema's roles are admin and member; the owner, Dana, is an admin). Do not
  # grant it to members. A real client decides on day one whether pay rates are forbidden.
  - key: LABOUR_COST
    label: Labour cost
  # Runtime: the Routing map (Story 15.5, AD-R17, routing.audience below). The map image
  # shows approximate locations (GRD-002), so who sees it is decided by name: neither key
  # comes with the admin role (admin_grantable: false).
  - key: ROUTING_ALL_CREWS
    label: Routing map, every crew (dispatchers)
    admin_grantable: false
  - key: ROUTING_OWN_CREW
    label: Routing map, own crew only (crew leads)
    admin_grantable: false
  # Runtime: Data sources on /brightside-v0 (plan brightside-v0, Story 16.3, D8): what data,
  # known truths, rules and added context a hub has. Not open_access: on a hub that sees rules
  # it lists the known truths and who signed them off. The admin role confers it.
  - key: DATA_SOURCES
    label: Data sources
  # Runtime: Add context on /brightside-v0 (plan brightside-v0, Story 16.5, D8): admins type
  # what Ask should know about the business; it is live at once, and everyone who can use Ask
  # on that hub can read it. The admin role confers it. Never open_access: boot refuses that.
  - key: ADD_CONTEXT
    label: Add context
  # Runtime: Build request on /brightside-v0 (plan brightside-v0, Story 16.6, D11): a person's
  # own words and the AI's summary of them, previewed, then posted to
  # slack.build_requests_channel below naming them. The admin role confers it.
  - key: BUILD_REQUEST
    label: Build request
  # Runtime: Ask on /brightside-v0 (plan brightside-v0, Story 16.7, D10, gate item 4): answers
  # from the hub's added context, routes data questions by readiness and points to tools the
  # person can open. The admin role confers it; grant it to anyone else by name. Never
  # open_access (boot refuses that: it would include people the profile doesn't name).
  - key: ASK
    label: Ask

users:
  - id: dana
    name: Dana Reyes
    role: admin
    # slack: the aplabs-demo member id Ely uses to drive Dana in the dev workspace.
    identities: { github: dana-r, slack: U0CB6HDBBQX }
    # ROUTING_ALL_CREWS: a dev placeholder (Story 15.5) so Ely, driving Dana, can run the
    # routing live check as a dispatcher. Pending Dana Reyes's audience list (DEP-024).
    grants: [TIER3_APPROVE, WIN_BACK, ROUTING_ALL_CREWS]
  - id: marcus
    name: Marcus Lee
    role: member
    identities: { github: mlee-bright }
    grants: [VERIFY_SKIP]
  # Steven Auslander (AP Labs partner): admin so he can drive /brightside-v0 in the dev
  # workspace (plan steven-access, 2026-10-31). No by-name grants (no Win-back, no routing map).
  - id: steven
    name: Steven Auslander
    role: admin
    identities: { slack: U0CB6GJ6UTH }

# Slack settings (kit/runtime).
slack:
  # #ai-build-requests in the aplabs-demo workspace (the bot is a member). Its audience: the
  # AP Labs build team and the client's admins. Build requests post here (plan brightside-v0,
  # D11, the AD-14 amendment): the requester's own previewed words and the AI's summary, from
  # a hub that sees neither context nor data (/brightside-v0) only. A channel id, not a secret.
  build_requests_channel: C0CDEPKQDRT

# Columns no query may name (kit/runtime/sql). While any is set, SELECT * and
# whole-row references are refused too.
sql:
  forbidden_columns:
    - clients.phone
    - properties.street_address
    - properties.postal_code
    # Coordinates (Story 13.3, GRD-002): forbidden before the generator adds them
    # (Story 14.1), and forbidden to every query and every other read path.
    # travelMatrix is the one exception; it returns whole minutes only (AD-R9).
    - properties.geo_lat_e6
    - properties.geo_lon_e6
    - crews.base_geo_lat_e6
    - crews.base_geo_lon_e6
    # The Office (Story 15.15, AD-R23): a point Ely chose, rounded to 0.002 degrees,
    # forbidden like the others in the same PR that adds the depots table.
    - depots.geo_lat_e6
    - depots.geo_lon_e6

# Route optimization (AD-R10). Each node kind's coordinate columns (micro-degree
# INTEGER) must also be in sql.forbidden_columns above. The engine knows the
# kinds property, crew and depot (the Office, Story 15.15). Limits are minutes after local midnight, the
# generator's day: 06:00 earliest, 08:00 default start, aim 18:00, 23:00 latest.
routing:
  coordinates:
    nodes:
      - { kind: property, table: properties, id_column: property_id, lat_column: geo_lat_e6, lon_column: geo_lon_e6 }
      - { kind: crew, table: crews, id_column: crew_id, lat_column: base_geo_lat_e6, lon_column: base_geo_lon_e6 }
      - { kind: depot, table: depots, id_column: depot_id, lat_column: geo_lat_e6, lon_column: geo_lon_e6 }
  speed_kmh: 40
  detour_factor: 1.3
  min_travel_minutes: 5
  limits: { earliest_start: 360, default_start: 480, aim_finish: 1080, latest_finish: 1380, slot_minutes: 15 }
  # The Office (Story 15.15, AD-R23): where every crew starts and ends in Plan a route.
  # Its position is the depots row, read like any node; it is shown only as this label.
  # Routing's four views keep each crew's base. A fork sets its own node and label.
  depot: { node: "depot:office", label: Office }
  # Who sees the routing map (Story 15.5, AD-R17): all_crews sees every crew; own_crew plus
  # a crew_leads row sees that crew only. A DEV PLACEHOLDER until Dana Reyes confirms the
  # real audience (DEP-024): one dispatcher (dana, the user Ely drives in dev) and no crew
  # leads. The Routing module is dev-only (environments ["dev"]) until Story 15.6.
  audience:
    all_crews: ROUTING_ALL_CREWS
    own_crew: ROUTING_OWN_CREW
    # pending Dana Reyes (DEP-024): which people lead which crew. Add { user, crew_id } rows
    # (crew_id without the crew: prefix); each user needs the ROUTING_OWN_CREW grant.
    crew_leads: []
  # The street map under the routing map (Story 15.11, AD-R18): OpenStreetMap's free tiles,
  # for dev and the demo only. Its policy asks for an app name and a contact in the
  # User-Agent; the contact is Ely's (DEP-030) and names no client. A real fork sets its own
  # production provider here (DEP-031). APLABS_BASEMAP_OFF turns it off; without the network
  # the plain map shows. The wording Dana signs is GRD-002's (DEP-025); the module stays
  # dev-only until then.
  basemap:
    url_template: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    attribution: "© OpenStreetMap contributors"
    attribution_url: "https://www.openstreetmap.org/copyright"
    user_agent: "aplabs-routing-map/1.0 (+mailto:elyjiahpotter@gmail.com)"
    max_zoom: 19
    cache_days: 7

verify:
  checks:
    - id: unit
      run: [npm, test]
    # Story 7.6: the fixture's integrity and synthetic-only checks. The known
    # truths in context/data.md run after these, as truth:<id>.
    # No --profile: verify passes this profile as APLABS_GOVERNING_PROFILE
    # (never APLABS_PROFILE, which would leak into the unit check), so a fork
    # that copies the block enforces its own forbidden columns (issue #77).
    - id: fixture-validate
      run: [node, kit/fixture/validate.js, examples/brightside/fixture]
