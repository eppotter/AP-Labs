# The tables and columns a query rule may read (plan brightside-v1, D10 and D11).
#
# A bridge: Story 19.7 moves this list into the profile's `ask` block (ask.tables), and
# deletes this file in the same change. Until then the query-rule verify check
# (`npm run verify`, query-rule:<id>; kit/lib/query-rules allowListFor) reads it from here,
# beside data.md. With neither, every query rule fails its check.
#
# The list is D10's table as approved with the plan on 2026-10-31. SQLsmith signs the final
# list in Story 19.7. Not allowed: staff, pay_rates, timesheets, crew_memberships and
# staff_absences (staff names and ids), depots, every name, email, phone, address and
# coordinate, and scheduled_visits.labour_minutes (GRD-006).
tables:
  zones: [zone_id, name]
  packages: [package_id, name, base_price_cents]
  add_ons: [add_on_id, name, price_cents]
  crews: [crew_id, zone_id, name]
  clients: [client_id, zone_id, created_on]
  properties: [property_id, client_id, city, home_type, square_feet, bedrooms, bathrooms, has_pets]
  plans: [plan_id, property_id, package_id, frequency, start_date, end_date, status, start_price_cents, price_cents]
  plan_price_changes: [change_id, plan_id, effective_date, old_price_cents, new_price_cents]
  visits: [visit_id, property_id, plan_id, crew_id, package_id, visit_date, status, arrival_window, scheduled_start, scheduled_minutes]
  scheduled_visits: [scheduled_visit_id, property_id, plan_id, crew_id, package_id, visit_date, status, status_changed_on, arrival_window, scheduled_start, scheduled_minutes, route_order, travel_minutes_from_previous]
  invoices: [invoice_id, client_id, visit_id, issued_on, due_on, total_cents]
  invoice_lines: [line_id, invoice_id, package_id, add_on_id, quantity, amount_cents]
  payments: [payment_id, invoice_id, paid_on, amount_cents, method]
  service_rules: [rule_id, property_id, rule_type, value, strength]
  fixture_meta: [key, value]
