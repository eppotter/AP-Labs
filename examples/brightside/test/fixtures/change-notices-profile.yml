# Test fixture for the change-notices example test (Story 20.3, plan
# brightside-v1 D14, D14a): the routing fixture's forbidden columns and
# routing block (the Office included), Ely and Steven with the same grants
# (every crew's routes and APPOINTMENT_EMAILS by name), a dispatcher who may
# see every crew but not send customer emails, and the lead of crew 8. Every
# Slack id is made up. Tests read this, never profiles/brightside/profile.yml.
# Deleted with the example in a fork.
schema_version: 1
client: { id: brightside, name: Brightside Home Cleaning }
# The demo fixture's resources (demo-profile.yml), so the whole example app loads.
resources:
  - { key: TIER3_APPROVE, label: Approve T3 changes, admin_grantable: false }
  - { key: VERIFY_SKIP, label: Waive a skipped verify check }
  - { key: HELLO_WORLD, label: Say hello, open_access: true }
  - { key: DATASET, label: Dataset, open_access: true }
  - { key: OUTBOX, label: Email outbox }
  - { key: WIN_BACK, label: Win-back list, admin_grantable: false }
  - { key: UNPAID_INVOICES, label: Unpaid invoices }
  - { key: LABOUR_COST, label: Labour cost }
  - { key: ROUTING_ALL_CREWS, label: Routing map for every crew, admin_grantable: false }
  - { key: ROUTING_OWN_CREW, label: Routing map for one's own crew, admin_grantable: false }
  - { key: DATA_SOURCES, label: Data sources }
  - { key: ADD_CONTEXT, label: Add context }
  - { key: BUILD_REQUEST, label: Build request }
  - { key: ASK, label: Ask }
  - { key: APPOINTMENT_EMAILS, label: Appointment emails, admin_grantable: false }
users:
  - { id: ely, name: Ely Potter, role: admin, identities: { slack: U0FIXTUREELY }, grants: [ROUTING_ALL_CREWS, APPOINTMENT_EMAILS] }
  # Steven holds every grant Ely holds (plan brightside-v1).
  - { id: steven, name: Steven Auslander, role: admin, identities: { slack: U0FIXTURESTEVEN }, grants: [ROUTING_ALL_CREWS, APPOINTMENT_EMAILS] }
  - { id: dee, name: Dee Dispatch, role: member, grants: [ROUTING_ALL_CREWS], identities: { slack: U0FIXTUREDEE } }
  - { id: lee, name: Lee Lead, role: member, grants: [ROUTING_OWN_CREW, APPOINTMENT_EMAILS], identities: { slack: U0FIXTURELEE } }
sql:
  forbidden_columns:
    - clients.phone
    - properties.street_address
    - properties.postal_code
    - properties.geo_lat_e6
    - properties.geo_lon_e6
    - crews.base_geo_lat_e6
    - crews.base_geo_lon_e6
    - depots.geo_lat_e6
    - depots.geo_lon_e6
routing:
  coordinates:
    nodes:
      - { kind: property, table: properties, id_column: property_id, lat_column: geo_lat_e6, lon_column: geo_lon_e6 }
      - { kind: crew, table: crews, id_column: crew_id, lat_column: base_geo_lat_e6, lon_column: base_geo_lon_e6 }
      - { kind: depot, table: depots, id_column: depot_id, lat_column: geo_lat_e6, lon_column: geo_lon_e6 }
  speed_kmh: 40
  detour_factor: 1.3
  min_travel_minutes: 5
  limits: { earliest_start: 360, default_start: 480, aim_finish: 1080, latest_finish: 1380, slot_minutes: 15 }
  depot: { node: "depot:office", label: Office }
  audience:
    all_crews: ROUTING_ALL_CREWS
    own_crew: ROUTING_OWN_CREW
    crew_leads:
      - { user: lee, crew_id: "8" }
