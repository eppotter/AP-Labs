# A synthetic profile with a routing block and an Office (AD-R23, Story
# 15.13): a depot node source whose coordinate columns are forbidden like the
# others, and routing.depot naming one of its nodes. Made-up names only; the
# Office's position is in the data, never here.
schema_version: 1
client: { id: route-co, name: Route Co }
users:
  - { id: solo, name: Solo, role: admin }
sql:
  forbidden_columns:
    - sites.pos_lat_e6
    - sites.pos_lon_e6
    - vans.home_lat_e6
    - vans.home_lon_e6
    - offices.geo_lat_e6
    - offices.geo_lon_e6
routing:
  coordinates:
    nodes:
      - { kind: site, table: sites, id_column: site_id, lat_column: pos_lat_e6, lon_column: pos_lon_e6 }
      - { kind: van, table: vans, id_column: van_id, lat_column: home_lat_e6, lon_column: home_lon_e6 }
      - { kind: depot, table: offices, id_column: office_id, lat_column: geo_lat_e6, lon_column: geo_lon_e6 }
  speed_kmh: 40
  detour_factor: 1.3
  limits: { earliest_start: 420, default_start: 450, aim_finish: 1020, latest_finish: 1320, slot_minutes: 10 }
  depot: { node: "depot:hq", label: Office }
