# A synthetic profile that sets every routing key, none left to defaults.
schema_version: 1
client: { id: route-co, name: Route Co }
users:
  - { id: solo, name: Solo, role: admin }
sql:
  forbidden_columns: [sites.pos_lat_e6, sites.pos_lon_e6, sites.phone]
routing:
  coordinates:
    nodes:
      - { kind: site, table: sites, id_column: site_id, lat_column: pos_lat_e6, lon_column: pos_lon_e6 }
  speed_kmh: 32.5
  detour_factor: 1.25
  min_travel_minutes: 3
  max_pairs: 2500
  limits: { earliest_start: 360, default_start: 480, aim_finish: 1080, latest_finish: 1380, slot_minutes: 15 }
  gap_fill:
    horizon_days: 7
    limit: 3
    weights: { extra_drive_minutes: -2, flexible: 1 }
