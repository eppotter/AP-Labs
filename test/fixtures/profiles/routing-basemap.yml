# A synthetic profile with a routing block and a street map source (AD-R18,
# Story 15.9): only the basemap's required keys, so the defaults show. The
# host is a made-up one; tests answer it with test/fixtures/fake-tiles.js and
# never reach the network.
schema_version: 1
client: { id: route-co, name: Route Co }
users:
  - { id: solo, name: Solo, role: admin }
sql:
  forbidden_columns:
    - sites.pos_lat_e6
    - sites.pos_lon_e6
    - vans.home_lat_e6
    - vans.home_lon_e6
routing:
  coordinates:
    nodes:
      - { kind: site, table: sites, id_column: site_id, lat_column: pos_lat_e6, lon_column: pos_lon_e6 }
      - { kind: van, table: vans, id_column: van_id, lat_column: home_lat_e6, lon_column: home_lon_e6 }
  speed_kmh: 40
  detour_factor: 1.3
  limits: { earliest_start: 420, default_start: 450, aim_finish: 1020, latest_finish: 1320, slot_minutes: 10 }
  basemap:
    url_template: https://tiles.example.org/{z}/{x}/{y}.png
    attribution: © Example Map contributors
    attribution_url: https://tiles.example.org/copyright
    user_agent: aplabs-routing-map/0.0.0 (+https://example.org/contact)
