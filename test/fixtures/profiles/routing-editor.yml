# A synthetic profile for Plan a route (Story 15.14, AD-R23, AD-R26): the
# routing-audience fixture's people and audience, plus an Office: a depot
# node source whose coordinate columns are forbidden like the others, and
# routing.depot naming one of its nodes. Every name and id is made up; the
# Office's position is in the test data, never here.
schema_version: 1
client: { id: route-co, name: Route Co }
resources:
  - { key: ROUTING_ALL_CREWS, label: Routing map for every crew }
  - { key: ROUTING_OWN_CREW, label: Routing map for one's own crew }
  - { key: OTHER_THING, label: Something else }
users:
  - { id: admin, name: Admin, role: admin, identities: { slack: UADMIN } }
  - { id: dispatch, name: Dispatcher, role: member, grants: [ROUTING_ALL_CREWS], identities: { slack: UDISPATCH } }
  - { id: lead-a, name: Lead A, role: member, grants: [ROUTING_OWN_CREW], identities: { slack: ULEADA } }
  - { id: lead-b, name: Lead B, role: member, grants: [ROUTING_OWN_CREW, OTHER_THING], identities: { slack: ULEADB } }
  - { id: member, name: Member, role: member, grants: [OTHER_THING], identities: { slack: UMEMBER } }
  - { id: lead-none, name: Lead None, role: member, grants: [ROUTING_OWN_CREW], identities: { slack: ULEADNONE } }
  - { id: lead-ghost, name: Lead Ghost, role: member, grants: [ROUTING_OWN_CREW], identities: { slack: ULEADGHOST } }
sql:
  forbidden_columns:
    - sites.pos_lat_e6
    - sites.pos_lon_e6
    - vans.home_lat_e6
    - vans.home_lon_e6
    - offices.geo_lat_e6
    - offices.geo_lon_e6
routing:
  coordinates:
    nodes:
      - { kind: site, table: sites, id_column: site_id, lat_column: pos_lat_e6, lon_column: pos_lon_e6 }
      - { kind: van, table: vans, id_column: van_id, lat_column: home_lat_e6, lon_column: home_lon_e6 }
      - { kind: depot, table: offices, id_column: office_id, lat_column: geo_lat_e6, lon_column: geo_lon_e6 }
  speed_kmh: 40
  detour_factor: 1.3
  limits: { earliest_start: 420, default_start: 450, aim_finish: 1020, latest_finish: 1320, slot_minutes: 10 }
  audience:
    all_crews: ROUTING_ALL_CREWS
    own_crew: ROUTING_OWN_CREW
    crew_leads:
      - { user: lead-a, crew_id: v1 }
      - { user: lead-b, crew_id: v2 }
      - { user: lead-ghost, crew_id: v9 }
  depot: { node: "depot:hq", label: Office }
