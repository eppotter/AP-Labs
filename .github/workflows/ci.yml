name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Shellcheck
        run: git ls-files '*.sh' | xargs --no-run-if-empty shellcheck
      - name: Tests (unit, hook, acceptance)
        run: npm test
      - name: Verify harness
        run: npm run verify
