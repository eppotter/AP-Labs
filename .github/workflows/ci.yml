name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Shellcheck
        run: git ls-files '*.sh' ':(exclude).agents' ':(exclude)_bmad' | xargs --no-run-if-empty shellcheck
      - name: Tests (unit, hook, acceptance)
        run: npm test
      - name: Fixture seeds match the generator
        run: npm run fixture:check
      - name: Verify harness
        # A client fork (governed: .aplabs/profile.yml exists) runs strict, so a
        # skipped check (missing executable), a timeout or zero checks fails CI
        # (#24). The template itself has no profile and stays a plain run.
        run: |
          if [ -f .aplabs/profile.yml ]; then
            npm run verify -- --strict
          else
            npm run verify
          fi
      - name: Ledger row
        if: github.event_name == 'pull_request'
        run: node scripts/ledger-check.js --base "origin/${{ github.base_ref }}"
