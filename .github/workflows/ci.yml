name: ci

# Every PR runs CI, and so does every push to main (plan ledger-rows): a PR
# lands without main merged into it first, so its CI ran against an older
# main, and two PRs that each passed alone can break main together. The run
# on main shows that within minutes of the merge, and gives template:release
# the four jobs green on main's head. A run by hand
# (`gh workflow run ci.yml --ref main`) works too. Non-PR runs are never
# narrowed (scripts/ci-changes.js).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its older, superseded run. A run that is not a
# pull request gets its own group (its run id), so it is never cancelled or
# replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which jobs this run needs. Only a pull request is narrowed: a docs-only
    # PR (every file under docs/, by the review tool's docs-only rule) skips
    # test:slow, clean-bones and dist; container runs only when an image
    # input changed. Any doubt (a git error, no files) runs everything. A
    # skipped job reports "skipping", which npm run land accepts; a failed
    # changes job fails the run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      container: ${{ steps.plan.outputs.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Changed files
        id: plan
        run: node scripts/ci-changes.js >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Shellcheck
        run: git ls-files '*.sh' ':(exclude).agents' ':(exclude)_bmad' | xargs --no-run-if-empty shellcheck
      - name: Tests (unit, hook, acceptance)
        run: npm test
      # The long tests (the ci-fork fork copy, the template-update repos) skip
      # in `npm test` and run here (plan ci-split). The template and every fork
      # run it; only a docs-only PR skips it. The runner fails on any skip or
      # zero passes.
      - name: Slow tests (fork copy, template update)
        if: needs.changes.outputs.code == 'true'
        run: npm run test:slow
      # The three fixture steps skip only in a fork whose example client was
      # deleted (Story 11.5, review B10); the template always runs them.
      - name: Fixture seeds match the generator
        run: |
          if [ -f .aplabs/profile.yml ] && [ ! -d examples/brightside ]; then echo "skipped: no example client in this fork"; exit 0; fi
          npm run fixture:check
      - name: Fixture builds into DuckDB (offline)
        run: |
          if [ -f .aplabs/profile.yml ] && [ ! -d examples/brightside ]; then echo "skipped: no example client in this fork"; exit 0; fi
          npm run fixture:build
      - name: Fixture checks pass (integrity, synthetic-only)
        # The validator fails closed with no profile (#77). A fork has
        # .aplabs/profile.yml; the template names Brightside's.
        run: |
          if [ -f .aplabs/profile.yml ] && [ ! -d examples/brightside ]; then echo "skipped: no example client in this fork"; exit 0; fi
          if [ ! -f .aplabs/profile.yml ]; then export APLABS_PROFILE="$PWD/profiles/brightside/profile.yml"; fi
          npm run fixture:validate
      - name: Engine untouched (forks only)
        # Story 11.5: fork status comes from the profile, never the record
        # (review B8), so every fork runs it and a fork with no
        # .aplabs/template-version fails. Offline: it recomputes the engine
        # fingerprint and compares it with the record.
        run: |
          if [ -f .aplabs/profile.yml ]; then
            npm run template:check
          else
            echo "template:check: not a fork (no .aplabs/profile.yml); skipped"
          fi
      - name: Verify harness
        # A client fork (governed: .aplabs/profile.yml exists) runs strict, so a
        # skipped check (missing executable), a timeout or zero checks fails CI
        # (#24). The template itself has no profile and stays a plain run.
        run: |
          if [ -f .aplabs/profile.yml ]; then
            npm run verify -- --strict
          else
            npm run verify
          fi
      - name: Ledger row
        if: github.event_name == 'pull_request'
        run: node scripts/ledger-check.js --base "origin/${{ github.base_ref }}"

  clean-bones:
    # The template stands alone without its example client (Story 6.5): copy
    # the repo, delete examples/brightside/ and profiles/brightside/, then run
    # check, test and a boot smoke test against a minimal stub profile. It
    # runs the whole suite in that copy, so any code or test can break it:
    # only a docs-only PR skips it.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Clean bones
        run: npm run clean-bones

  dist:
    # The distribution tree (plan template-dist, Story D.2): what client forks
    # receive, the release minus the internal paths (kit/lib/dist EXCLUDED)
    # with the ledger's rows emptied. On every code PR it builds that tree for
    # HEAD, scans it with the deny list, checks its engine fingerprint, and
    # runs check, test and test:slow inside it, so a release whose dist tree
    # would break can't be cut (a required job). Skipped in a fork and in the
    # dist repo itself (neither has docs/reference/). No secrets. A docs-only
    # PR skips it: the fast suite's tripwire already scans the shipped tree
    # with the deny list.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Distribution tree builds and passes its tests
        run: |
          if [ -f .aplabs/profile.yml ] || [ ! -d docs/reference ]; then echo "skipped: not the template source repo"; exit 0; fi
          npm run template:publish -- --check

  container:
    # The app runs in a container (Story 11.2): build the image, then run its
    # smoke test inside it with no network, a read-only filesystem (only /tmp
    # and APLABS_VAR_DIR writable) and the test fixtures mounted read-only,
    # and the route map smoke the same way (Story 15.3).
    # Plain docker build and run: no third-party actions, no secrets, no
    # build args. Local `npm test` skips the image build (no docker there).
    # Runs only when an image input changed (scripts/ci-changes.js).
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag aplabs-runtime:ci .
      - name: Show the image (user, platform, size)
        run: docker image inspect aplabs-runtime:ci --format 'user={{.Config.User}} platform={{.Os}}/{{.Architecture}} size={{.Size}} bytes'
      - name: Smoke test inside the image (no network, read-only, fake Slack)
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --tmpfs /var/lib/aplabs:rw,mode=1777 \
            --volume "$PWD/test/fixtures:/app/test/fixtures:ro" \
            aplabs-runtime:ci \
            node scripts/container-smoke.js
      # The route map's rasterizer is a native binary (@resvg/resvg-js, Story
      # 15.3): draw each map fixture to a PNG inside the image and check its
      # size, so the binary is proved on the image we ship.
      - name: Route map renders inside the image (no network, read-only)
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --volume "$PWD/test/fixtures:/app/test/fixtures:ro" \
            aplabs-runtime:ci \
            node scripts/smoke-routing-map.js
